name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - run: nix develop -c just ci ${{ github.event.pull_request.base.sha || github.event.before || github.event.merge_group.base_sha }}

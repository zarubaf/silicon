[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
backend-circt = { path = "../crates/backend-circt" }
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
core-ir = { path = "../crates/core-ir", features = ["gen"] }
num-bigint = "0.4.6"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
regex = "1.13.1"
syntax = { path = "../crates/syntax", features = ["gen"] }
tempfile = "3.27.0"
testkit = { path = "../crates/testkit" }
toml = "1.1.7"

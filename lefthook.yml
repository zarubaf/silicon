pre-commit:
  commands:
    fmt-check:
      run: just fmt-check
    prose:
      glob: "*.{md,lean}"
      run: just prose {staged_files}
    clippy:
      glob: "*.rs"
      run: just clippy

commit-msg:
  commands:
    commit-msg:
      run: just commit-msg {1}

pre-push:
  commands:
    ci:
      run: just ci main

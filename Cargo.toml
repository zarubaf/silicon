[workspace]
resolver = "3"
members = [
  "crates/backend-circt",
  "crates/core-ir",
  "crates/driver",
  "crates/elab",
  "crates/parse",
  "crates/resolve",
  "crates/srcgen",
  "crates/typeck",
  "crates/syntax",
  "crates/testkit",
  "xtask",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.metadata.layers]
order = [
  "core-ir",
  "syntax",
  "srcgen",
  "parse",
  "resolve",
  "typeck",
  "elab",
  "backend-circt",
  "testkit",
  "driver",
]
dev-only = ["srcgen", "testkit"]

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "deny"
unused = { level = "deny", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"

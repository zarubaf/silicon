[workspace]
resolver = "3"
members = ["crates/backend-circt", "crates/core-ir", "crates/driver", "crates/syntax", "xtask"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.metadata.layers]
order = ["core-ir", "syntax", "backend-circt", "driver"]

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "deny"
unused = { level = "deny", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"

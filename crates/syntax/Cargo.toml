[package]
name = "syntax"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
gen = ["dep:core-ir", "dep:num-bigint", "core-ir/gen"]

[dependencies]
core-ir = { path = "../core-ir", optional = true }
num-bigint = { version = "0.4.6", optional = true }
rowan = "0.16.1"

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
